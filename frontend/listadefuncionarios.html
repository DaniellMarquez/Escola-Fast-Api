<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Funcionários</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
    <h1 class="mb-4">Lista de Funcionários</h1>

    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body">
            <h5 class="card-title fw-bold mb-3">
                🔎 Filtrar funcionários
            </h5>

            <div class="row g-3 align-items-end">
                <div class="col-md-3">
                    <label for="campoFiltro" class="form-label">Filtrar por</label>
                    <select id="campoFiltro" class="form-select">
                        <option value="codFunc">Código</option>
                        <option value="nome">Nome</option>
                        <option value="cpf">CPF</option>
                        <option value="email">E-mail</option>
                        <option value="data_nascimento">Data Nasc.</option>
                        <option value="telefone">Telefone</option>
                        <option value="cidade">Cidade</option>
                    </select>
                </div>

                <div class="col-md-5">
                    <label for="textoFiltro" class="form-label">Pesquisar</label>
                    <input type="text" id="textoFiltro" class="form-control" placeholder="Digite o que deseja pesquisar...">
                </div>

                <div class="col-md-2">
                    <button type="button" id="btnBuscar" class="btn btn-primary w-100">Buscar</button>
                </div>

                <div class="col-md-2">
                    <button type="button" id="btnLimparFiltro" class="btn btn-secondary w-100">Limpar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Tabela para renderização dos dados -->
    <div class="table-responsive mb-4">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
                <tr>
                    <th>Código</th>
                    <th>Nome</th>
                    <th>CPF</th>
                    <th>E-mail</th>
                    <th>Data Nasc.</th>
                    <th>Telefone</th>
                    <th>Cidade</th>
                </tr>
            </thead>
            <tbody id="listaFuncionarios">
            </tbody>
        </table>
    </div>

    <div>
        <a href="/cadastro-de-funcionario" class="btn btn-link">Cadastrar novo funcionário</a> | 
        <a href="/" class="btn btn-link">Voltar ao início</a>
    </div>

    <script src="/frontend/js/funcionario.js"></script>
</body>
</html>
