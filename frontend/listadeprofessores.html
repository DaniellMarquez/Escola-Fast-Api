<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Lista de Professores</title>
    <!-- CSS do Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">

    <h1 class="mb-4">Lista de Professores</h1>

    <div class="card shadow-sm border-0 mb-4">

        <div class="card-body">

            <h5 class="card-title fw-bold mb-3">
                🔎 Filtrar professores
            </h5>

            <div class="row g-3 align-items-end">

                <div class="col-md-3">

                    <label
                        for="campoFiltro"
                        class="form-label"
                    >
                        Filtrar por
                    </label>

                    <select
                        id="campoFiltro"
                        class="form-select"
                    >

                        <option value="codProf">
                            Código
                        </option>

                        <option value="nome">
                            Nome
                        </option>

                        <option value="cpf">
                            CPF
                        </option>

                        <option value="email">
                            E-mail
                        </option>

                        <option value="data_nascimento">
                            Data de nascimento
                        </option>

                        <option value="telefone">
                            Telefone
                        </option>

                        <option value="cargo">
                            Cargo
                        </option>

                        <option value="cidade">
                            Cidade
                        </option>

                    </select>

                </div>

                <div class="col-md-5">

                    <label
                        for="textoFiltro"
                        class="form-label"
                    >
                        Pesquisar
                    </label>

                    <input
                        type="text"
                        id="textoFiltro"
                        class="form-control"
                        placeholder="Digite o que deseja pesquisar..."
                    >

                </div>

                <div class="col-md-2">

                    <button
                        type="button"
                        id="btnBuscar"
                        class="btn btn-primary w-100"
                    >
                        Buscar
                    </button>

                </div>

                <div class="col-md-2">

                    <button
                        type="button"
                        id="btnLimparFiltro"
                        class="btn btn-secondary w-100"
                    >
                        Limpar
                    </button>

                </div>

            </div>

        </div>

    </div>

    <!-- Tabela estilizada -->
    <table class="table table-striped table-hover align-middle">
        <thead class="table-dark">
            <tr>
                <th>Código</th>
                <th>Nome</th>
                <th>CPF</th>
                <th>E-mail</th>
                <th>Data de Nascimento</th>
                <th>Telefone</th>
                <th>Cargo</th>
                <th>Cidade</th>
            </tr>
        </thead>
        <tbody id="listaProfessores">
        </tbody>
    </table>

    <br>
    <a href="/cadastro-de-professor" class="btn btn-link">Cadastrar Novo Professor</a> | 
    <a href="/" class="btn btn-link">Voltar ao início</a>

    <script src="/frontend/js/professor.js"></script>
</body>
</html>
