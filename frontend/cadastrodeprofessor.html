<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Professor</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-success text-white py-3">
                        <h1 class="h4 mb-0 fw-bold">
                            <i class="bi bi-person-badge-fill me-2"></i>Cadastro de Professor
                        </h1>
                    </div>

                    <div class="card-body p-4">
                        <form id="form-professor">

                            <div class="mb-3">
                                <label for="nome" class="form-label">Nome completo</label>
                                <input type="text" id="nome" name="nome" class="form-control" placeholder="Ex: Prof. Carlos Lima" required>
                            </div>

                            <div class="mb-3">
                                <label for="cpf" class="form-label">CPF</label>
                                <input type="text" id="cpf" name="cpf" class="form-control" placeholder="000.000.000-00" required>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">E-mail</label>
                                <input type="email" id="email" name="email" class="form-control" placeholder="professor@email.com" required>
                            </div>

                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label for="data_nascimento" class="form-label">Data de nascimento</label>
                                    <input type="date" id="data_nascimento" name="data_nascimento" class="form-control" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="telefone" class="form-label">Telefone</label>
                                    <input type="tel" id="telefone" name="telefone" class="form-control" placeholder="(00) 00000-0000" required>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="cidade" class="form-label">Cidade</label>
                                <input type="text" id="cidade" name="cidade" class="form-control" placeholder="Sua cidade" required>
                            </div>

                            <button type="submit" class="btn btn-success w-100 py-2 fw-bold">
                                Cadastrar Professor
                            </button>

                        </form>

                        <div id="mensagem" class="mt-3" aria-live="polite"></div>
                    </div>
                </div>

                <div class="text-center mt-3">
                    <a href="/lista-de-professores" class="btn btn-link link-secondary">
                        <i class="bi bi-list-ul me-1"></i> Ver lista de professores
                    </a>
                    <span class="text-muted">|</span>
                    <a href="/" class="btn btn-link link-secondary">
                        <i class="bi bi-house-door-fill me-1"></i> Voltar para o início
                    </a>
                </div>

            </div>
        </div>
    </div>

    <script src="/frontend/js/professor.js"></script>
</body>
</html>
